name: CI

on:
  push:
  workflow_dispatch:
    inputs:
      version:
        description: 'Talos version to build'
        required: true
        type: string

jobs:
  build:
    name: Build Talos ${{ matrix.variant }} ${{ matrix.arch }}
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        arch: [amd64, arm64]
        variant: [default, nocloud]
    env:
      TALOS_VERSION: ${{ github.event.inputs.version || 'v1.14.7' }} # renovate: datasource=github-tags depName=siderolabs/talos
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd qemu-utils tar xz-utils curl jq

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Download and verify upstream bundle
        # Only the metal disk ships in the Talos GitHub release with a cosign bundle.
        # Image Factory publishes no signature for the nocloud disk, so build-image.sh
        # downloads it over HTTPS and logs its sha256.
        if: matrix.variant == 'default'
        run: |
          source scripts/lib.sh
          URL="$(upstream_image_url default "${TALOS_VERSION}" "${{ matrix.arch }}")"
          WORK_DIR="build-default-${{ matrix.arch }}"
          mkdir -p "${WORK_DIR}"

          RAW_FILE="${WORK_DIR}/$(basename "${URL}")"
          BUNDLE_FILE="${RAW_FILE}.bundle"

          echo "Downloading raw image and bundle..."
          curl -L -f "${URL}" -o "${RAW_FILE}"
          curl -L -f "${URL}.bundle" -o "${BUNDLE_FILE}"

          echo "Verifying bundle signature..."
          cosign verify-blob \
            --bundle "${BUNDLE_FILE}" \
            --certificate-identity-regexp '^https://github.com/siderolabs/talos' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "${RAW_FILE}"
          echo "✓ Bundle signature verified"

      - name: Build split-format image
        run: |
          ./scripts/build-image.sh "${TALOS_VERSION}" "${{ matrix.arch }}" "${{ matrix.variant }}"

      - name: Verify artifacts
        run: |
          source scripts/lib.sh
          PREFIX="$(variant_prefix "${{ matrix.variant }}")"
          META_FILE="${PREFIX}-${{ matrix.arch }}-incus.tar.xz"
          DISK_FILE="${PREFIX}-${{ matrix.arch }}.qcow2"
          for file in "${META_FILE}" "${DISK_FILE}"; do
            if [ ! -f "$file" ]; then
              echo "Error: $file not found"
              exit 1
            fi
          done
          echo "✓ Artifacts verified:"
          ls -lh "${META_FILE}" "${DISK_FILE}"

      - name: Calculate SHA256 hashes and sizes
        id: hashes
        run: |
          source scripts/lib.sh
          PREFIX="$(variant_prefix "${{ matrix.variant }}")"
          META_FILE="${PREFIX}-${{ matrix.arch }}-incus.tar.xz"
          DISK_FILE="${PREFIX}-${{ matrix.arch }}.qcow2"
          
          META_HASH=$(sha256sum "${META_FILE}" | cut -d' ' -f1)
          DISK_HASH=$(sha256sum "${DISK_FILE}" | cut -d' ' -f1)
          META_SIZE=$(stat -c%s "${META_FILE}")
          DISK_SIZE=$(stat -c%s "${DISK_FILE}")
          
          cat "${META_FILE}" "${DISK_FILE}" | sha256sum | cut -d' ' -f1 > /tmp/combined_hash
          COMBINED_HASH=$(cat /tmp/combined_hash)
          
          CREATION_DATE=$(date +%s)
          
          echo "meta_hash=${META_HASH}" >> $GITHUB_OUTPUT
          echo "disk_hash=${DISK_HASH}" >> $GITHUB_OUTPUT
          echo "combined_hash=${COMBINED_HASH}" >> $GITHUB_OUTPUT
          echo "meta_size=${META_SIZE}" >> $GITHUB_OUTPUT
          echo "disk_size=${DISK_SIZE}" >> $GITHUB_OUTPUT
          echo "creation_date=${CREATION_DATE}" >> $GITHUB_OUTPUT
          echo "meta_file=${META_FILE}" >> $GITHUB_OUTPUT
          echo "disk_file=${DISK_FILE}" >> $GITHUB_OUTPUT

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: talos-${{ matrix.variant }}-${{ matrix.arch }}
          path: |
            ${{ steps.hashes.outputs.meta_file }}
            ${{ steps.hashes.outputs.disk_file }}
          retention-days: 1

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      id-token: write
    env:
      TALOS_VERSION: ${{ github.event.inputs.version || 'v1.14.7' }} # renovate: datasource=github-tags depName=siderolabs/talos
      GH_TOKEN: ${{ github.token }}
      # Keep in sync with the build job matrix.
      ARCHES: amd64,arm64
      VARIANTS: default,nocloud
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Find variants missing from the release
        id: pending
        run: |
          PENDING="$(./scripts/pending-variants.sh "${TALOS_VERSION}" "${ARCHES}" "${VARIANTS}")"
          echo "variants=${PENDING}" >> "$GITHUB_OUTPUT"
          if [ -z "${PENDING}" ]; then
            echo "Release ${TALOS_VERSION} has every variant, skipping release"
          else
            echo "Will publish variants: ${PENDING}"
          fi

      - name: Download artifacts
        if: steps.pending.outputs.variants != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: talos-*
          merge-multiple: true

      - name: Sign artifacts
        if: steps.pending.outputs.variants != ''
        run: |
          ./scripts/sign-artifacts.sh "${ARCHES}" "${{ steps.pending.outputs.variants }}"

      - name: Look up KV namespace ID by name
        if: steps.pending.outputs.variants != ''
        id: kv_namespace
        run: |
          NAMESPACE_NAME="windsorcli-dev-images"
          NAMESPACE_ID=$(curl -s -X GET "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/storage/kv/namespaces" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" | \
            python3 -c "import sys, json; data=json.load(sys.stdin); ns=[n for n in data.get('result', []) if n.get('title') == '$NAMESPACE_NAME']; print(ns[0]['id'] if ns else '')" || echo "")
          
          if [ -z "$NAMESPACE_ID" ]; then
            echo "Error: KV namespace '$NAMESPACE_NAME' not found"
            exit 1
          fi
          
          echo "namespace_id=$NAMESPACE_ID" >> $GITHUB_OUTPUT

      - name: Upload metadata to Cloudflare KV
        if: steps.pending.outputs.variants != ''
        run: |
          ./scripts/upload-kv-metadata.sh \
            "${{ steps.kv_namespace.outputs.namespace_id }}" \
            "${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" \
            "${TALOS_VERSION}" \
            "${ARCHES}" \
            "${{ steps.pending.outputs.variants }}"

      - name: Create GitHub Release
        if: steps.pending.outputs.variants != ''
        run: |
          ./scripts/create-release.sh \
            "${TALOS_VERSION}" \
            "${ARCHES}" \
            "${{ steps.pending.outputs.variants }}"
